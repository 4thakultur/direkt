<div class="actions">
  {% if d.can_resume %}<button class="icon-btn primary" hx-post="/ui/downloads/{{ d.id }}/resume" hx-target="#flash" title="Resume" aria-label="Resume {{ d.name }}"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg></button>{% endif %}
  {% if d.can_pause %}<button class="icon-btn" hx-post="/ui/downloads/{{ d.id }}/pause" hx-target="#flash" title="Pause" aria-label="Pause {{ d.name }}"><svg class="icon" aria-hidden="true"><use href="#i-pause"/></svg></button>{% endif %}
  {% if d.can_retry %}<button class="icon-btn primary" hx-post="/ui/downloads/{{ d.id }}/retry" hx-target="#flash" title="Retry" aria-label="Retry {{ d.name }}"><svg class="icon" aria-hidden="true"><use href="#i-retry"/></svg></button>{% endif %}
  {% if d.can_organize %}<button class="icon-btn primary" hx-post="/ui/downloads/{{ d.id }}/organize" hx-target="#flash" title="Organize again" aria-label="Organize {{ d.name }} again"><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg></button>{% endif %}
  {% if d.can_cancel %}<button class="icon-btn danger" hx-get="/ui/downloads/{{ d.id }}/cancel/confirm" hx-target="#modal" title="Cancel" aria-label="Cancel {{ d.name }}"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>{% endif %}
  {% if d.can_delete %}{% if d.state == "completed" %}<button class="icon-btn" hx-get="/ui/downloads/{{ d.id }}/delete/confirm" hx-target="#modal" title="Remove from list (keeps the file)" aria-label="Remove {{ d.name }} from the list"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>{% else %}<button class="icon-btn danger" hx-post="/ui/downloads/{{ d.id }}/delete" hx-target="#flash" title="Delete" aria-label="Delete {{ d.name }}"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg></button>{% endif %}{% endif %}
  {% if d.can_delete_file %}<button class="icon-btn danger" hx-get="/ui/downloads/{{ d.id }}/delete-file/confirm" hx-target="#modal" title="Delete file from disk" aria-label="Delete the file of {{ d.name }}"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg></button>{% endif %}
</div>
