{% extends "base.html" %}
{% block title %}Log in · Direkt{% endblock %}
{% block body %}
<main class="narrow">
  <div class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h1 class="brand-large">Direkt</h1>
  <form method="post" action="/login" class="card stack">
    <h2>Log in</h2>
    {% if let Some(error) = error %}<p class="flash error">{{ error }}</p>{% endif %}
    <label>Username
      <input name="username" value="{{ username }}" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="primary">Log in</button>
  </form>
</main>
{% endblock %}
