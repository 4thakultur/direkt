{% extends "app.html" %}
{% block title %}Downloads · Direkt{% endblock %}
{% block content %}
<section class="card">
  {{ submit|safe }}
</section>

<div id="flash" aria-live="polite"></div>

<nav class="tabs">
  {% for tab in tabs %}
  <a href="/?f={{ tab.key }}"{% if tab.active %} class="active" aria-current="page"{% endif %}>{{ tab.label }}</a>
  {% endfor %}
</nav>

<div id="rows" hx-get="/ui/rows?f={{ filter }}" hx-trigger="every 2s, downloads-changed from:body">
  {% include "_rows.html" %}
</div>
{% endblock %}
