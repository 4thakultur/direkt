<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <title>Direkt — self-hosted direct download manager</title>
  <defs>
    <radialGradient id="glow" cx="0.24" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#0071e3" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="1.05" r="0.5">
      <stop offset="0" stop-color="#3fa2ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3fa2ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.3" fill="#fff" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa2ff"/>
      <stop offset="1" stop-color="#0071e3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fa2ff"/>
      <stop offset="1" stop-color="#0071e3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0071e3" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0b0b0d"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <!-- App icon: same as assets/logo.svg at 256 px. -->
  <g transform="translate(130 192)" filter="url(#shadow)">
    <rect width="256" height="256" rx="58" fill="url(#tile)"/>
    <rect width="256" height="256" rx="58" fill="url(#sheen)"/>
    <g transform="translate(38 38) scale(7.5)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/>
    </g>
  </g>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="458" y="300" font-size="132" font-weight="700" letter-spacing="-4" fill="#f5f5f7">Direkt</text>
    <text x="462" y="358" font-size="34" font-weight="600" fill="#f5f5f7" fill-opacity="0.92">Self-hosted direct download manager</text>
    <text x="462" y="402" font-size="25" fill="#a1a1a6">Paste a link. It downloads, survives restarts and lands</text>
    <text x="462" y="436" font-size="25" fill="#a1a1a6">in your Jellyfin and Plex libraries.</text>

    <!-- A download row, as in the UI. -->
    <g transform="translate(462 474)">
      <rect width="560" height="8" rx="4" fill="#fff" fill-opacity="0.12"/>
      <rect width="392" height="8" rx="4" fill="url(#bar)"/>
      <text x="0" y="40" font-size="19" fill="#8e8e93">Rust  ·  Docker Compose  ·  HTTP(S) &amp; 1fichier  ·  Web UI &amp; API</text>
    </g>
  </g>
</svg>
